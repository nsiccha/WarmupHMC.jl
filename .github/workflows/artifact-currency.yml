# Does every checked-in measurement still describe the CURRENT sampler --
# and does RESULTS.md still quote those measurements correctly?
#
# WHY THIS EXISTS, AND WHY IT IS SEPARATE FROM EVERY OTHER JOB
#
# `docs/benchmark/artifact_currency.jl` walks every tracked artifact under
# results/, reads the `warmuphmc_sha` it recorded, and asks whether that
# revision's `src/` still defines the same methods as the tip. It has been
# written, correct, and — since `c7c6d7c` — RED, and nothing anywhere said so:
# seven files reference the script in prose and, until this job, zero workflows
# invoked it. Both agents who found the red found it by running it by hand.
#
# That is the sharpest member of a family this repo keeps hitting. An
# enumerating consumer cannot fail on a deleted file; a census in prose cannot
# fail on a new site; and a check wired to nothing cannot fail at all. The last
# is the worst of the three, because the check itself is already correct — the
# only missing part was somewhere to run it.
#
# WHY NOT FOLD IT INTO THE DOCS BUILD
#
# `Docs.yml` checks out at depth 1 and `makedocs` has no history to consult, so
# no artifact's base SHA would resolve there and the script would go red on
# every run for a reason that has nothing to do with currency. Wrong signal, and
# a job that is red for the wrong reason is a job that gets muted.
#
# WHY `fetch-depth: 0` IS NOT OPTIONAL
#
# Base-SHA resolution IS the check. `actions/checkout@v4` defaults to depth 1 —
# the tip and nothing else — so every base would come back unresolvable. The
# script reports that as red rather than skipping it, deliberately: a currency
# check that passes because it could not look anything up is worse than none.
#
# But an all-unresolvable red and a genuinely-stale red BOTH exit 1, and they
# look different only if someone reads the log. So the step below asserts the
# clone is not shallow BEFORE running the script, and fails with its own message
# if it is. Without that assertion, dropping `fetch-depth: 0` would leave a job
# that is still red, still exits 1, and no longer checks anything — the guard's
# own failure mode, the same one probe-schema.yml's seed step exists to close.
#
# `fetch-depth: 0` IS NECESSARY BUT NOT SUFFICIENT
#
# A base can also be recorded that no ref contains — rebased away, or never
# published. Measured on the `5637fcf` pair: present in the KB mirror as an
# object, contained by zero refs, absent from the `--all` walk, on no tag. No
# checkout setting recovers that; a fresh clone never had the object at all. The
# script distinguishes the three states (not fetched + shallow, not fetched +
# full clone, present + on no ref) so the log names which one applies. Do not
# read a red here as "raise the fetch depth" without checking which it says.
#
# WHY `src/**` IS A TRIGGER AND `results/**` IS THE LESSER ONE
#
# This check goes red when the SAMPLER changes, not when the numbers do. A
# commit touching only `src/` can invalidate every artifact in the repo without
# going near results/ — that is exactly what `c7c6d7c` did, staling 12 of them
# at once. Omitting `src/**` would leave the job firing only on the side that is
# not the cause.
#
# NO HEAVY JULIA ENVIRONMENT
#
# `artifact_currency.jl` shells out to `git` and includes `code_identical.jl`; it
# needs no package environment, no `instantiate`, no BridgeStan, and no Treebars
# clone. That is why this is its own small job rather than a step bolted onto a
# heavy one — it costs a checkout and a Julia startup.
#
# `quoted_figures.jl` (the second check, below) needs JSON, and gets it from a
# TEMP environment holding that one package. Instantiating `docs/benchmark/` to
# reach the same import would drag in BridgeStan, Enzyme and PosteriorDB and
# turn a seconds-long job into a heavy one, which is the property this whole
# file is arranged around. Keep any future check here to that standard: if it
# cannot run without instantiating a sampler environment, it belongs in another
# workflow, not this one.
#
# THE SECOND CHECK ANSWERS A DIFFERENT QUESTION
#
# Currency asks whether the JSON still describes today's sampler. `RESULTS.md`
# quoting that JSON correctly is independent — both can be true while the other
# is false — and it has NO other seam anywhere in the repo: `RESULTS.md` is not
# in `make.jl`'s `pages`, carries no `@eval`/`@example` fence, and is therefore
# never executed by the docs build. Every figure in it is a static census that
# only a human can correct. Three defects came out of that gap in a single day
# (a hand-copied band, a reversed funnel verdict with a rationalisation already
# attached, and one bare-gradient figure quoted two different ways fifteen lines
# apart). `RESULTS.md` is a path trigger above for exactly this reason: a
# prose-only edit is the commit that most needs this job and the one that would
# otherwise never fire it.

name: Artifact currency

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'docs/benchmark/results/**'
      - 'docs/benchmark/artifact_currency.jl'
      - 'docs/benchmark/code_identical.jl'
      - 'docs/benchmark/quoted_figures.jl'
      - 'docs/benchmark/RESULTS.md'
      - '.github/workflows/artifact-currency.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'docs/benchmark/results/**'
      - 'docs/benchmark/artifact_currency.jl'
      - 'docs/benchmark/code_identical.jl'
      - 'docs/benchmark/quoted_figures.jl'
      - 'docs/benchmark/RESULTS.md'
      - '.github/workflows/artifact-currency.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  currency:
    name: Measurements are current, and RESULTS.md quotes them correctly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # REQUIRED. See the header: at the default depth 1 no base resolves and
      # this job checks nothing while still exiting 1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Guard the guard — refuse to run against a shallow clone
        run: |
          shallow=$(git rev-parse --is-shallow-repository)
          echo "is-shallow-repository: $shallow"
          if [ "$shallow" != "false" ]; then
            echo "::error::This clone is SHALLOW, so no artifact's base SHA can resolve."
            echo "::error::The currency check would report every artifact as unfetched"
            echo "::error::and exit 1 while verifying nothing. Restore 'fetch-depth: 0'"
            echo "::error::on the checkout step above."
            exit 1
          fi
          echo "Full history present: $(git rev-list --count HEAD) commits."

      - name: Are the checked-in measurements current?
        run: julia --startup-file=no docs/benchmark/artifact_currency.jl

      # The neighbouring question, and a genuinely different one: the step above
      # asks whether the JSON still describes today's sampler, this one asks
      # whether RESULTS.md still quotes the JSON correctly. Both can be true
      # while the other is false, and the second has no other seam anywhere --
      # RESULTS.md is not in `make.jl`'s `pages`, has no `@eval` fence, and is
      # therefore never executed by the docs build.
      #
      # Own temp environment on purpose. `artifact_currency.jl` is deliberately
      # dependency-free so this job costs a checkout and a Julia startup;
      # `quoted_figures.jl` needs JSON, and instantiating `docs/benchmark/`
      # (BridgeStan, Enzyme, PosteriorDB, WarmupHMC) to get it would turn a
      # seconds-long job into a heavy one. A temp env with the one dependency
      # keeps that property.
      - name: Do the figures quoted in RESULTS.md still match those artifacts?
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.add(["JSON", "Statistics"]; io = devnull)
            include("docs/benchmark/quoted_figures.jl")
            exit(main_figures())'

      - name: What a failure here means
        if: failure()
        run: |
          echo "TWO different checks run in this job. Read which step went red."
          echo
          echo "=== 'Do the figures quoted in RESULTS.md still match' ==="
          echo "A number in RESULTS.md disagrees with the artifact it was read"
          echo "from. The log names the figure, what the prose says, and what the"
          echo "JSON says. Two causes, and they need opposite fixes:"
          echo
          echo "  prose is stale   -> the artifact was regenerated and the prose"
          echo "                      was not. Retype the number, but re-read the"
          echo "                      surrounding ARGUMENT first: a figure that"
          echo "                      moved may have moved a conclusion, and a"
          echo "                      reversed verdict with an explanation still"
          echo "                      attached to it reads as already-investigated."
          echo "  figure reworded  -> a ':pattern' check found no match at all."
          echo "                      The quantity it guarded is now unchecked."
          echo "                      Update the regex in quoted_figures.jl; do"
          echo "                      not delete the check to go green."
          echo
          echo "Never 'fix' this by editing the JSON to match the prose. That"
          echo "asserts a measurement nobody made."
          echo
          echo "=== 'Are the checked-in measurements current' ==="
          echo "An artifact under docs/benchmark/results/ no longer describes the"
          echo "sampler at this tip, or its recorded base cannot be resolved. The"
          echo "log names each one and which of the two it is."
          echo
          echo "STALE       -> re-measure that artifact. Do not edit the recorded"
          echo "               warmuphmc_sha to match the tip; that asserts a"
          echo "               measurement nobody made."
          echo "NOT FETCHED -> read whether it says shallow or FULL clone. Shallow"
          echo "               is a checkout setting; full clone means the object"
          echo "               is not in the repository at all."
          echo "ON NO REF   -> the base was rebased away or never published. No"
          echo "               checkout setting recovers it. Re-measure, or mark"
          echo "               the run SUPERSEDED with a reason if it is kept as"
          echo "               history."
          echo
          echo "A run kept deliberately as history (a before/after pair, an"
          echo "outdated base a result is argued from) is SUPPOSED to differ from"
          echo "the tip. Say so with a SUPERSEDED file in that run's own"
          echo "directory, whose first line is the reason."
