# Generate a small nonlinear-weighting benchmark, derive its tables, and upload
# the fresh rows. CI checks execution and schema compatibility, not performance
# thresholds. Research results are generated locally and are not committed;
# see bench/research/README.md for reproduction.

name: Nonlinear weighting benchmark

on:
  workflow_dispatch:
  # Path-scoped: this is minutes of sampling, and nothing outside these files
  # can change its outcome.
  push:
    branches: [main, dev]
    paths:
      - 'bench/research/nonlinear_weighting*.jl'
      - '.github/workflows/nonlinear-weighting.yml'
      - 'bench/research/common.jl'
      - 'bench/research/Project.toml'
      - 'src/**'
  pull_request:
    paths:
      - 'bench/research/nonlinear_weighting*.jl'
      - '.github/workflows/nonlinear-weighting.yml'
      - 'bench/research/common.jl'
      - 'bench/research/Project.toml'
      - 'src/**'

permissions:
  actions: write        # let julia-actions/cache evict its own caches
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate the benchmark environment
        # Keep the environment aligned with test.yml's linear-evidence job.
        # Treebars main supplies the progress API used by the sampler.
        run: |
          git clone --branch main https://github.com/nsiccha/Treebars.jl.git
          julia --project=bench/research -e 'using Pkg; Pkg.develop([
            PackageSpec(path=pwd()),
            PackageSpec(path="Treebars.jl"),
          ]); Pkg.instantiate()'
      - name: Run the smoke configuration
        # The two ANALYTIC targets only. `radon_mn-radon_partially_pooled_centered`
        # is deliberately excluded: it needs posteriordb plus a BridgeStan model
        # compile, which is minutes of C++ before any sampling starts, and it is
        # the dimension-88 target — it would make this the slowest job in the
        # repo to prove exactly what the two cheap targets already prove.
        env:
          WHMC_NW_TARGETS: funnel,eight_schools
          WHMC_NW_SEEDS: '1:2'
          WHMC_NW_DRAWS: '200'
          WHMC_NW_OUT: ci-rows
        run: julia --project=bench/research bench/research/nonlinear_weighting_run.jl
      - name: Derive from the fresh rows
        # Schema drift check, not a numeric one. Every value below is whatever
        # the runner produced; the assertion is only that the derivation can
        # still consume rows the driver has just written.
        run: |
          julia --project=bench/research -e '
            include("bench/research/nonlinear_weighting.jl")
            doc = nw_load("ci-rows/rows.json"); rows = doc["rows"]
            length(rows) == 16 || error("expected 16 smoke rows, got $(length(rows))")
            println(nw_aggregate_table(rows))
            println(nw_discrimination_table(rows))
            println(nw_conclusion(rows))
          '
      - name: Upload the raw rows
        # Retain the fresh rows for inspection and local derivation.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonlinear-weighting-ci-rows
          path: ci-rows/rows.json
