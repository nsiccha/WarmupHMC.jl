name: Run tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, edited]

permissions:
  actions: write        # let julia-actions/cache evict its own caches
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # `fail-fast: false` so one red row in a nine-row matrix does not hide the
      # other eight; part of this suite is statistical and seeing every platform
      # at once is the point.
      fail-fast: false
      matrix:
        julia-version: ['lts', '1', 'pre']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest, macOS-latest]
        # IF A WINDOWS OR macOS ROW GOES RED ON `n_adapted == length(rows)` IN
        # `web/src/test/reparametrized_e2e.jl`, SCOPE THAT GATE TO LINUX — DO NOT
        # LOOSEN IT.
        #
        # The RNG is deterministic, but per-platform BLAS reduction order is not,
        # and the linear-algebra path feeds the sampler's trajectories, so a
        # non-Linux row can legitimately land on different draws. That assertion
        # is nonetheless the one guard that catches the regression this suite was
        # built for: between 34ce034 and 095efb0 the halo pool was starved, which
        # made `variance_cond` noisy, which meant funnel seeds 3 and 4 never
        # restarted and ran BYTE-IDENTICAL to the plain sampler. The medians
        # stayed green throughout — the adapting seeds carried them. Relaxing
        # this back to `>= 3` restores exactly that blind spot.
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v2
      - name: Dev unregistered dependencies
        # `--branch dev` is load-bearing, exactly as in Docs.yml: `Treebars.round2`
        # — which `src/progress.jl` adds a method to at load time — exists on
        # `origin/dev` but NOT on `origin/main`, so a default-branch clone fails
        # at precompile with `UndefVarError: round2` before any test runs.
        #
        # The explicit `Pkg.develop` is needed on every matrix row, not just as a
        # pin: `[sources]` is honoured from Julia 1.11 only, so on `lts` (1.10)
        # Treebars would otherwise resolve as "expected to be registered".
        # Batched (§ the one-resolve rule) even at length 1, for when it grows.
        run: |
          git clone --branch dev https://github.com/nsiccha/Treebars.jl.git
          julia --project=. -e 'using Pkg; Pkg.develop([
            PackageSpec(path="Treebars.jl"),
          ]); Pkg.instantiate()'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run tests
        # NOT `julia-actions/julia-runtest@v1`: this package's suite lives at
        # `web/src/test/runtests.jl`, not the `test/runtests.jl` the action and
        # `Pkg.test` assume. Running against `--project=.` rather than the test
        # target is deliberate and sufficient — the suite needs neither
        # TestModules nor Documenter, and it needs `ForwardDiff` (transitive,
        # via Pathfinder) to be in the manifest, which it is only in the package
        # env. `web/src/test/ad_backend.jl` loads it by UUID and aborts loudly
        # if it is missing or if the reparametrization gradient method is gone,
        # so a broken AD setup fails the job instead of silently skipping every
        # reparametrization testset.
        run: julia --project=. -e 'include("web/src/test/runtests.jl")'

  # Reverse-mode (Enzyme) coverage — ONE job, deliberately outside the matrix
  # above.
  #
  # The main suite pins `AutoForwardDiff()`, which is the one backend immune to
  # the failures this job exists to catch: `dbde8d2` broke `Enzyme.Const` — the
  # backend the `ReparametrizedProblem` docstring and both docs pages recommend
  # — and landed fully green, because nothing committed here executed a
  # reverse-mode backend.
  #
  # Not folded into the matrix: Enzyme's compile is heavy and the matrix is nine
  # rows, so that would be nine Enzyme builds per push. Not added to the root
  # `Project.toml` either — that would make WarmupHMC itself hard-depend on one
  # specific AD backend, which is the opposite of the `ad_backend=nothing`,
  # user-supplies-the-backend design.
  enzyme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private unregistered dependencies
        run: git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate the Enzyme environment
        # `Pkg.develop` rather than `[sources]`: the package under test is the
        # checkout itself, and this has to work on the same Julia versions the
        # matrix uses.
        #
        # Treebars MUST be cloned and dev'd explicitly here, for the same reason
        # the matrix job does it — and it is easy to conclude otherwise from a
        # local run. On a developer box this step resolves fine without the
        # clone, because Pkg finds a Treebars checkout already on disk. A GitHub
        # runner has neither that checkout nor a root `Manifest.toml` (it is
        # gitignored), and WarmupHMC's `[sources]` is not consulted for a *dev'd
        # dependency* of this environment — only for an active project. So
        # without these lines the step resolves Treebars as "expected to be
        # registered" on a clean runner.
        #
        # `--branch dev` is the same load-bearing detail as the matrix job:
        # `Treebars.round2`, which `src/progress.jl` adds a method to at load
        # time, exists on `origin/dev` and NOT on `origin/main`.
        run: |
          git clone --branch dev https://github.com/nsiccha/Treebars.jl.git
          julia --project=web/src/test/enzyme -e 'using Pkg; Pkg.develop([
            PackageSpec(path=pwd()),
            PackageSpec(path="Treebars.jl"),
          ]); Pkg.instantiate()'
      - name: Run Enzyme tests
        run: julia --project=web/src/test/enzyme web/src/test/enzyme/runtests.jl
