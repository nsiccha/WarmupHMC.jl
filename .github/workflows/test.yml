name: Run tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, edited]

permissions:
  actions: write        # let julia-actions/cache evict its own caches
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # `fail-fast: false` so one red row in a nine-row matrix does not hide the
      # other eight; part of this suite is statistical and seeing every platform
      # at once is the point.
      fail-fast: false
      matrix:
        julia-version: ['lts', '1', 'pre']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest, macOS-latest]
        # IF A WINDOWS OR macOS ROW GOES RED ON `n_adapted == length(rows)` IN
        # `web/src/test/reparametrized_e2e.jl`, SCOPE THAT GATE TO LINUX — DO NOT
        # LOOSEN IT.
        #
        # The RNG is deterministic, but per-platform BLAS reduction order is not,
        # and the linear-algebra path feeds the sampler's trajectories, so a
        # non-Linux row can legitimately land on different draws. That assertion
        # is nonetheless the one guard that catches the regression this suite was
        # built for: between 34ce034 and 095efb0 the halo pool was starved, which
        # made `variance_cond` noisy, which meant funnel seeds 3 and 4 never
        # restarted and ran BYTE-IDENTICAL to the plain sampler. The medians
        # stayed green throughout — the adapting seeds carried them. Relaxing
        # this back to `>= 3` restores exactly that blind spot.
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v2
      - name: Instantiate the test environment
        # `--branch dev` is load-bearing, exactly as in Docs.yml: `Treebars.round2`
        # — which `src/progress.jl` adds a method to at load time — exists on
        # `origin/dev` but NOT on `origin/main`, so a default-branch clone fails
        # at precompile with `UndefVarError: round2` before any test runs.
        #
        # The explicit `Pkg.develop` is needed on every matrix row, not just as a
        # pin: `[sources]` is honoured from Julia 1.11 only, so on `lts` (1.10)
        # Treebars would otherwise resolve as "expected to be registered". A
        # runner has no `Manifest.toml` either (it is gitignored) and WarmupHMC's
        # `[sources]` is not consulted for a dev'd *dependency* of another
        # environment, so this cannot be dropped on the strength of a local run.
        # Batched (§ the one-resolve rule) so Pkg sees both paths in one resolve.
        run: |
          git clone --branch dev https://github.com/nsiccha/Treebars.jl.git
          julia --project=web/src/test -e 'using Pkg; Pkg.develop([
            PackageSpec(path=pwd()),
            PackageSpec(path="Treebars.jl"),
          ]); Pkg.instantiate()'
      - name: Run tests
        # NOT `julia-actions/julia-runtest@v1`: this package's suite lives at
        # `web/src/test/runtests.jl`, not the `test/runtests.jl` the action and
        # `Pkg.test` assume. (`test/` IS a symlink to it, but git checks symlinks
        # out as plain text files on Windows unless core.symlinks is on, so the
        # real path is the portable one.)
        #
        # `--skip-tag=enzyme` is what keeps Enzyme out of all nine rows; the job
        # below runs those items once. Skipping a tag is a no-op if no item
        # carries it, so this stays correct if the Enzyme items are ever removed.
        run: julia --project=web/src/test -e 'include("web/src/test/runtests.jl")' -- --skip-tag=enzyme

  # Reverse-mode (Enzyme) coverage — ONE job, deliberately outside the matrix
  # above.
  #
  # The rest of the suite pins `AutoForwardDiff()`, which is the one backend
  # immune to the failures this job exists to catch: `dbde8d2` broke
  # `Enzyme.Const` — the backend the `ReparametrizedProblem` docstring and both
  # docs pages recommend — and landed fully green, because nothing committed
  # here executed a reverse-mode backend.
  #
  # Not folded into the matrix: Enzyme's compile is heavy and the matrix is nine
  # rows, so that would be nine Enzyme builds per push. Not added to the root
  # `Project.toml` either — that would make WarmupHMC itself hard-depend on one
  # specific AD backend, which is the opposite of the `ad_backend=nothing`,
  # user-supplies-the-backend design.
  #
  # It is no longer a separate ENVIRONMENT, though. `web/src/test/enzyme/` had
  # its own `Project.toml` to keep Enzyme out of the matrix; a `:enzyme` tag on
  # the item does the same job with one manifest instead of two, so the two jobs
  # can no longer drift apart in what they resolve.
  enzyme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private unregistered dependencies
        run: git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate the test environment
        # Identical to the matrix job's step, and for the same reasons — the two
        # now share one environment, so keep them in step.
        run: |
          git clone --branch dev https://github.com/nsiccha/Treebars.jl.git
          julia --project=web/src/test -e 'using Pkg; Pkg.develop([
            PackageSpec(path=pwd()),
            PackageSpec(path="Treebars.jl"),
          ]); Pkg.instantiate()'
      - name: Run the Enzyme items
        # `--tag=enzyme` errors if it matches nothing, so deleting or retagging
        # the last Enzyme item turns this job red rather than letting it pass
        # while running no tests at all.
        run: julia --project=web/src/test -e 'include("web/src/test/runtests.jl")' -- --tag=enzyme
