# NOT "1.9". That bound was not merely untested — it was UNSATISFIABLE: nine of the
# thirteen non-stdlib direct dependencies declare `julia = "1.10"` themselves
# (DifferentiationInterface, Distributions, DynamicHMC, FillArrays,
# LogDensityProblems, LogExpFunctions, MCMCDiagnosticTools, Pathfinder, Treebars),
# so no 1.9 resolution of this project exists. All three committed manifests are
# 1.10.11, and the CI matrix is lts/1/pre. `test/compat.jl` now checks that this
# bound is never again lower than a dependency's.
julia = "1.10"

