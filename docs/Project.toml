[deps]
AlgebraOfVega = "a2420894-485a-4f42-a4fc-c4323ec6fb2b"
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
DocumenterVitepress = "4710194d-e776-4893-9690-8d956a29c365"
DynamicObjects = "23d02862-63fe-4c6e-8fdb-1d52cbbd39d5"
HTMX = "27f3e1ef-6ef8-44dc-9e9a-2fb23ed44e83"
HTMXObjects = "b12ef442-5798-4353-80f3-9562b03a0cb6"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
LogDensityProblems = "6fdf6af0-433a-55f7-b3ed-c6c6e0b8df7c"
Markdown = "d6f4376e-aef5-505a-96c1-9c027394607a"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Treebars = "e1e568c4-3a56-40a4-95fa-9b9c6c16fccb"
WarmupHMC = "60658175-6863-4866-a322-ab51a11c0cfe"

# The unregistered dependencies above (AlgebraOfVega, DynamicObjects, HTMX,
# HTMXObjects, Treebars) are supplied by `Pkg.develop(PackageSpec(path=...))`
# against the clones `.github/workflows/Docs.yml` makes, exactly as `web/` does.
#
# Do NOT re-add `[sources.<pkg>] url=/rev=` entries for them. `Pkg.develop`
# merges a requested `path` with an existing source, so a `url` source plus a
# `path` develop for the same package is
#
#     ERROR: `path` and `url` are conflicting specifications
#     Pkg.API.update_source_if_set -> develop
#
# and it fails the whole `Install dependencies` step before anything builds.
# It cannot be caught locally: `[sources]` is Julia 1.11+, so on the 1.10.11
# compute host both spellings resolve fine, while CI's `version: '1'`
# (1.12.6 at the time of writing) errors. That is how it shipped once — the
# five entries landed in `a392f5f`, and the first Docs run to see them
# (`dc9636f8`, run 30486850398) died in 45 s, leaving `brm-catalogue` a 404 on
# the published site while every local build passed.
#
# A `path` source is fine and needed — path+path does not conflict.
[sources.WarmupHMC]
path = ".."
