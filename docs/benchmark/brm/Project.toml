# Isolated project for the BRM catalogue benchmark.
#
# WHY THIS IS NOT IN docs/benchmark/Project.toml
#
# BayesianRegressionModels and StanBlocks are UNREGISTERED. Adding them to the
# shared benchmark project would make it uninstantiable for anyone without
# local checkouts of both — and that would break every OTHER benchmark runner
# in this directory, none of which needs them. The cost of the two unregistered
# dependencies is confined here.
#
# Regenerating the artifact needs both packages developed in at the SHAs
# recorded in results/brm_catalogue/rows.json. All THREE paths go in one
# `develop` call, and that is not a stylistic choice:
#
#   julia --project=docs/benchmark/brm -e '
#     using Pkg
#     Pkg.develop([PackageSpec(path="."),
#                  PackageSpec(path="/path/to/StanBlocks.jl"),
#                  PackageSpec(path="/path/to/BayesianRegressionModels.jl")])
#     Pkg.instantiate()'
#
#   * One call, because resolution requires every dependency to be resolvable
#     at once. Developing StanBlocks on its own fails with "expected package
#     BayesianRegressionModels to be registered".
#   * WarmupHMC included, because `[sources]` below is a Julia 1.11+ feature and
#     is IGNORED on 1.10 — without the explicit path, Pkg resolves WarmupHMC
#     from the registry, finds only 0.1.x, and BRM's `WarmupHMC = "0.2"` bound
#     makes it unsatisfiable. The `[sources]` entry is kept for 1.11+, matching
#     docs/benchmark/Project.toml.
#
# StanBlocks must be a checkout, not a release: BRM does not precompile against
# the registered StanBlocks (it fails inside a @deffun in src/sbimpl.jl).
#
# The docs BUILD needs none of this. It reads the checked-in JSON, like every
# other page — docs/Project.toml carries no BRM, no StanBlocks, no BridgeStan.

[deps]
BayesianRegressionModels = "cdd3e328-398d-47a6-a87b-6047aaf4b4bc"
