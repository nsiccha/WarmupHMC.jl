# Dedicated Enzyme environment — deliberately NOT part of the main test matrix.
#
# Why it is separate rather than deps in the root Project.toml:
#
#   * WarmupHMC is backend-AGNOSTIC. `ReparametrizedProblem`'s `ad_backend`
#     defaults to `nothing` and the user supplies the backend; the
#     DifferentiationInterface extension was deleted so DI is a plain
#     dependency with no AD package behind it. A root dep on Enzyme would
#     make the package hard-depend on one specific backend, which is the
#     opposite of that design.
#   * `.github/workflows/test.yml` runs the suite under `--project=.` across a
#     NINE-row matrix (3 julia versions x 3 OSes). Enzyme's compile is heavy;
#     paid nine times per push it dominates the job. This environment is
#     exercised by a single ubuntu/`1` job instead.
#
# There is deliberately NO ForwardDiff here. The reference for the gradient
# assertions is the CLOSED FORM at `src/Reparametrizations.jl:213-217`, not a
# second AD system — two AD backends agreeing does not establish that the
# objective is right, and the objective is what these tests are for.
# (`web/src/test/golden_awm.jl`'s `AutoForwardDiff()` is a frozen byte-identity
# baseline pin and is a different category; it stays.)

[deps]
DifferentiationInterface = "a0c0ee7d-e4b9-4e03-894e-1c5f64a51d63"
Enzyme = "7da242da-08ed-463a-9acd-ee780be4f1d9"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
DynamicHMC = "bbc10e6e-7c05-544b-b16e-64fede858acb"
LogDensityProblems = "6fdf6af0-433a-55f7-b3ed-c6c6e0b8df7c"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
WarmupHMC = "60658175-6863-4866-a322-ab51a11c0cfe"

[compat]
DifferentiationInterface = "0.6, 0.7"
Enzyme = "0.13"
LogDensityProblems = "2.1"
julia = "1.10"
